indexpage:
  title: 'NetApp Workload Factory : documentation'
  summary: Commencez à utiliser NetApp Workload Factory afin de tirer le meilleur
    parti de vos charges de travail de stockage cloud. Une fois la configuration terminée,
    vous pourrez créer, optimiser et gérer vos systèmes de stockage pour vos charges
    de travail, explorer les économies, utiliser le copilote Infrastructure-as-Code
    intégré pour l’automatisation sur toutes les plateformes et gérer vos charges
    de travail dans Workload Factory.
  keywords: Workload Factory, fsx, account, credentials, users, permissions, log in,
    calculator, codebox
  lead: Démarrez avec NetApp Workload Factory pour tirer le meilleur parti de vos
    charges de travail lorsque vous utilisez Amazon FSx for NetApp ONTAP et OCI NetApp
    Storage Service. Une fois la configuration terminée, vous pouvez créer, optimiser
    et gérer des systèmes de fichiers FSx for ONTAP pour vos charges de travail, explorer
    les économies avec FSx for ONTAP, utiliser le copilote Infrastructure-as-Code
    intégré pour l’automatisation sur toutes les plateformes et gérer vos charges
    de travail dans Workload Factory.
